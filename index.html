<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1115">
    <meta name="color-scheme" content="dark">
    <meta
      name="description"
      content="Personal portal for self-hosted services."
    >
    <title>Home · Personal Services</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-server" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="6" rx="2"></rect>
        <rect x="3" y="14" width="18" height="6" rx="2"></rect>
        <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"></path>
      </symbol>
      <symbol id="icon-bot" viewBox="0 0 24 24">
        <path d="M12 4V2"></path>
        <rect x="4" y="6" width="16" height="14" rx="4"></rect>
        <path d="M8 11h.01M16 11h.01M8.5 16h7"></path>
      </symbol>
      <symbol id="icon-game" viewBox="0 0 24 24">
        <path d="M8.5 9.5V6.8a1.8 1.8 0 0 1 3.6 0v2.7"></path>
        <path d="M12.1 9V5.8a1.8 1.8 0 0 1 3.6 0V10"></path>
        <path d="M15.7 9.5V7.3a1.8 1.8 0 0 1 3.6 0v6.2c0 4.7-2.8 7.5-7.3 7.5-3.2 0-5.3-1.4-6.7-3.7l-2.2-3.6a1.9 1.9 0 0 1 3-2.3l2.4 2.4V9.5"></path>
      </symbol>
      <symbol id="icon-speed" viewBox="0 0 24 24">
        <path d="M4.2 18a9 9 0 1 1 15.6 0"></path>
        <path d="M12 12l4-4"></path>
        <circle cx="12" cy="12" r="1.5"></circle>
        <path d="M6 18h12"></path>
      </symbol>
      <symbol id="icon-dmhy" viewBox="0 0 24 24">
        <circle cx="8.5" cy="9" r="4.5"></circle>
        <path d="m11.7 12.2 2.3 2.3M18 9v9m-3-3 3 3 3-3M15 21h6"></path>
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M7 17 17 7M8 7h9v9"></path>
      </symbol>
    </svg>

    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">MASKPIC</p>
          <h1>Home</h1>
          <p class="subtitle">Self-hosted services</p>
        </div>
        <p class="service-count" id="service-count" aria-live="polite"></p>
      </header>

      <section class="services-section" aria-labelledby="services-heading">
        <h2 class="visually-hidden" id="services-heading">Personal services</h2>
        <div class="services-grid" id="services-grid"></div>
        <noscript>
          <p class="noscript-message">
            This portal requires JavaScript to display its service links.
          </p>
        </noscript>
      </section>
    </main>

    <script src="/js/app.js" defer></script>
  </body>
</html>
